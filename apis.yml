aid: simpatico-project
name: Simpatico Project
description: >-
  Simpatico Project (유쾌한프로젝트, Yukwaehan Project Co., Ltd.) is a Korean B2B
  mental-wellness startup, backed by 500 Global, whose product Clify (클라이피,
  "Climb & Clarify") is an AI-based integrated mental-care and Employee
  Assistance Program (EAP) solution for individuals and companies. Clify uses a
  patented multimodal algorithm to fuse Face & Voice biosignals — blood-flow
  changes, micro-expressions and voice characteristics — into a roughly
  one-minute mental-state diagnosis (stress, anxiety, depression, burnout) that
  it claims exceeds 90% accuracy, and rolls the results up into an organization
  insight dashboard for HR (company-wide mental trends, high/low-risk teams,
  usage). Personal mental data is processed on-device and de-identified so it is
  never shared with the employer, and the company states it holds ISO 27001.
  Product surfaces include FAV (the Face & Voice AI diagnosis engine), an EAP
  counseling center, and the Clify organization-insight analytics. The public
  presence (clify.co.kr, an imweb-built marketing and account site) exposes no
  developer API, OpenAPI, SDK, or webhook surface at this time.
